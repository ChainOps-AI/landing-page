<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9fc" />
    <link rel="icon" type="image/svg+xml" href="/logo-light.svg?v=10" />
    <meta
      name="description"
      content="ChainOps is the production reliability layer for autonomous onchain systems. Trace intent, enforce policy, and verify outcomes."
    />
    <link rel="canonical" href="https://chainops.live/" />
    <meta property="og:url" content="https://chainops.live/" />
    <meta property="og:site_name" content="ChainOps" />
    <title>ChainOps | Reliability for autonomous onchain systems</title>
    <script>
      try {
        var theme = localStorage.getItem("chainops-landing-theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        var favicon = document.querySelector('link[rel="icon"]');
        if (favicon) favicon.href = theme === "dark" ? "/logo-dark.svg?v=10" : "/logo-light.svg?v=10";
      } catch (_) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
